[project]
name = "ai-dial-interceptor-google"
version = "0.1.0"
description = "Google Model Armor anonymizer interceptor for AI DIAL"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "EPAM RAIL", email = "SpecialEPM-DIALDevTeam@epam.com" }]
requires-python = ">=3.11,<3.13"
keywords = ["ai", "dial", "interceptor", "google", "anonymizer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
  "fastapi",
  "httpx",
  "openai",
  "aidial-sdk[telemetry]",
  "aidial-interceptors-sdk>=0.5.0",
  "google-cloud-dlp",
  "protobuf",
  "tabulate",
  "python-dotenv",
  "pillow",
  "numpy==1.26.4",
  "langfuse",
  "spacy==3.7.5",
  "aiostream"
]

# Make the package runnable as: `python -m ai_dial_interceptor_google` or `aidial-google`
[project.scripts]
aidial-google = "ai_dial_interceptor_google.__main__:main"

[project.urls]
Homepage = "https://epam-rail.com"
Documentation = "https://epam-rail.com/dial_api"
Repository = "https://github.com/epam/ai-dial-interceptor-google"

[tool.poetry]
packages = [{ include = "ai_dial_interceptor_google", from = "src" }]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"