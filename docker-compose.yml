name: dial-interceptor-google

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dial-interceptor-google:${TAG:-latest}
    env_file:
      - .env
    environment:
      INTERCEPTOR_PORT: ${INTERCEPTOR_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # example custom app config:
      DIAL_URL: ${DIAL_URL}
    ports:
      - "${INTERCEPTOR_PORT}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
